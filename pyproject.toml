[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almanac"
version = "0.3.1"
description = "Smart inventory forecasting for retail: the LLM as a context sensor over a deterministic core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nuwan Samaranayake" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "redis",
    "httpx",
    "aignite-groundwork @ git+https://github.com/nuwansamaranayake/groundwork@v0.1.1",
    "numpy",
    "pandas",
    "statsmodels",
    "lightgbm",
    "ortools",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# Automatic discovery so subpackages (app.engine) ship in wheels / non-editable installs;
# an explicit non-recursive list silently dropped app.engine from site-packages.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the ruleset explicitly: CI installs latest ruff, and default-select churn between
# ruff releases must not be able to redefine what "lint passes" means for this repo.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
